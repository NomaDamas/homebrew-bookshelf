name: Validate Bookside cask

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cask-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Install and verify (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            arch: arm64
          - runner: macos-26-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_ANALYTICS: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Load the checked-out cask
        run: |
          brew --version
          brew tap nomadamas/bookside "$GITHUB_WORKSPACE"
          if brew command trust >/dev/null 2>&1; then
            brew trust --cask nomadamas/bookside/bookside
          fi
      - name: Check style and metadata
        run: |
          git diff --check
          brew style --cask nomadamas/bookside/bookside
          brew audit --cask --online nomadamas/bookside/bookside
      - name: Install and exercise the bundled CLI
        env:
          BOOKSIDE_DATA_DIR: ${{ runner.temp }}/bookside-data
        run: |
          mkdir -p "$RUNNER_TEMP/Applications" "$BOOKSIDE_DATA_DIR"
          brew install --cask --no-ask --require-sha \
            --appdir="$RUNNER_TEMP/Applications" nomadamas/bookside/bookside
          codesign --verify --deep --strict "$RUNNER_TEMP/Applications/Bookside.app"
          bookside-cli --version
          bookside-cli doctor > "$RUNNER_TEMP/bookside-doctor.json"
          python3 - <<'PY'
          import json, os, plistlib
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          info = plistlib.loads((root / "Applications/Bookside.app/Contents/Info.plist").read_bytes())
          doctor = json.loads((root / "bookside-doctor.json").read_text())
          assert doctor["version"] == info["CFBundleShortVersionString"]
          assert doctor["bundle_identifier"] == info["CFBundleIdentifier"] == "org.nomadamas.bookside"
          print("Installed app and linked CLI metadata agree.")
          PY
      - name: Verify uninstall preserves external data
        run: |
          test -d "$RUNNER_TEMP/bookside-data"
          brew uninstall --cask nomadamas/bookside/bookside
          test ! -e "$RUNNER_TEMP/Applications/Bookside.app"
          test ! -L "$(brew --prefix)/bin/bookside-cli"
          test -d "$RUNNER_TEMP/bookside-data"
